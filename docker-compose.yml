# Бот + автоматический HTTPS (Caddy). Нужен домен, указывающий на этот сервер (A-запись), и открытые порты 80/443.
#   1) cp .env.example .env  и заполните;   2) DOMAIN=bot.example.com docker compose up -d --build
services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/bot.sqlite
      HOST: 0.0.0.0
      PORT: "3000"
    volumes:
      - botdata:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [bot]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?укажите DOMAIN=ваш.домен}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
volumes:
  botdata:
  caddydata:
